[package]
name = "amoeba"
version = "0.1.7"
edition = "2024"
description = "Petri, the open-source Rust CLI and terminal interface for Amoeba markets"
license = "Apache-2.0"
readme = "README.md"
publish = false

[[bin]]
name = "petri"
path = "src/main.rs"
test = false

[features]
default = []

[dependencies]
getrandom = "0.3.4"
flate2 = "1.1.9"
base64 = "0.22.1"
bincode = "1.3.3"
borsh = "0.10.4"
chrono = { version = "0.4.40", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5.32", features = ["derive", "env"] }
crossterm = "0.28.1"
light-client = "0.23.0"
light-account = "0.23.0"
light-sdk = "0.23.0"
light-token = "0.23.0"
libc = "0.2.183"
# Immutable SDK source for the finalized current governed deployment.
ameba_sdk = { package = "ameba-sdk", git = "https://github.com/amoeba-farm/petri-sdk.git", rev = "e600d19e64154a90f331171de32c2946956a74a5" }
photon-api = "0.56.0"
photon-reqwest = { package = "reqwest", version = "0.13.4" }
ratatui = "0.29.0"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
solana-derivation-path = "2.2"
solana-ed25519-program = "2.2.3"
solana-hash = "2.3"
solana-instruction = "2.3"
solana-keypair = "2.2"
solana-message = "2.4"
solana-program = { version = "2.2", default-features = false }
solana-pubkey = { version = "2.4", features = ["rand"] }
solana-remote-wallet = "2.3"
solana-signature = { version = "2.3", features = ["verify"] }
solana-signer = "2.2"
solana-system-interface = "1.0.0"
solana-transaction = { version = "2.2", features = ["bincode", "verify"] }
spl-associated-token-account = "6.0.0"
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
toml_edit = "0.25.4"
uriparse = "0.6.4"
yaml-rust2 = "0.11.0"
sha2 = "=0.10.9"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
bytes = "1.10.1"
h2 = "=0.4.13"
http = "1.3.1"
reqwest = { version = "0.12.12", default-features = false, features = ["http2"] }
tokio = { version = "1.43.0", features = ["net", "time"] }

[build-dependencies]
sha2 = "=0.10.9"
winresource = "0.1.31"

[patch.crates-io]
light-prover-client = { path = "vendor/light-prover-client-8.0.0" }
solana-ed25519-program = { path = "vendor/solana-ed25519-program-2.2.3" }
solana-keypair = { path = "vendor/solana-keypair-2.2.3" }
solana-signature = { path = "vendor/solana-signature-2.3.0" }

[workspace]
default-members = ["."]
resolver = "3"

[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1

[lints.rust]
warnings = "deny"
