name: Preview binaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag on the current public main commit
        type: string
        required: true
        default: v0.1.7
      publish:
        description: Publish after building (disable to qualify artifacts first)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: preview-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'amoeba-farm/petri' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '3'
      PETRI_REQUIRE_SDK_RUNTIME: '1'
      PETRI_UPDATE_CHANNEL: preview
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.93.1'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/sdk-compressed-verifier
            target/petri-sdk-runtime.bin
          key: petri-preview-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'release/public-sdk-source.json', 'scripts/sdk-*.mjs', 'scripts/build-sdk-runtime.mjs', 'scripts/runtime-tools/package*.json') }}
          restore-keys: petri-preview-${{ matrix.os }}-
      - name: Build bundled SDK runtime
        shell: bash
        run: node scripts/build-sdk-runtime.mjs --verify || node scripts/build-sdk-runtime.mjs
      - name: Build release and check startup
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=."$'\x1f'"--remap-path-prefix=$HOME=<home>"
          if [[ "$RUNNER_OS" == macOS ]]; then export CARGO_PROFILE_RELEASE_LTO=false; fi
          cargo build --release --locked --bin petri -j3
          target/release/petri --version
          target/release/petri --help
          target/release/petri --json config show
          node scripts/build-sdk-runtime.mjs --verify
          export PETRI_CONFIG_PATH="$RUNNER_TEMP/petri-launch-smoke/config.json"
          target/release/petri config set backend-url http://127.0.0.1:4000
          target/release/petri config reset backend-url
          node scripts/verify-sdk-runtime.mjs
      - name: Package explicit unsigned preview
        run: node scripts/package-petri-preview.mjs
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/sdk-compressed-verifier
            target/petri-sdk-runtime.bin
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          test "$(gh api repos/amoeba-farm/petri/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          test "$(find artifacts -maxdepth 1 -type f | wc -l)" -eq 6
          (cd artifacts; sha256sum -c ./*.sha256)
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --latest --title "Petri $RELEASE_TAG — Devnet preview" --notes-file release/preview-notes.md
