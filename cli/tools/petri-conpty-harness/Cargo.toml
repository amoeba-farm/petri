[package]
name = "petri-conpty-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Development-only native PTY acceptance harness for the Petri TUI"

[dependencies]
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }
