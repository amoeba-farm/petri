[package]
name = "petri-update-harness"
version = "0.1.3"
edition = "2024"
publish = false

[workspace]

[dependencies]
getrandom = "0.3.4"
libc = "0.2.183"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "=0.10.9"
flate2 = "1.1.9"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }
